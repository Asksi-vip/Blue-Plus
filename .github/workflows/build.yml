name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Permanent Fixed Keystore
        run: |
          if [ ! -f "app/blueplus.jks" ]; then
            keytool -genkeypair -v -keystore app/blueplus.jks -alias blueplus -keyalg RSA -keysize 2048 -validity 10000 -storepass blueplus123 -keypass blueplus123 -dname "CN=BluePlus, OU=Media, O=Blue, L=Baghdad, ST=Baghdad, C=IQ"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/blueplus.jks
            git commit -m "chore: save permanent fixed keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign & Verify APK with apksigner
        id: find_apk
        run: |
          APK_RAW=$(find app/build/outputs/apk/release -name "*.apk" -o -name "app-release.apk" | head -n 1)
          if [ -z "$APK_RAW" ]; then
            APK_RAW=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_RAW" ]; then
            echo "::error::No APK found in app/build/outputs/apk"
            exit 1
          fi
          
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          echo "Using zipalign: $ZIPALIGN"
          
          "$ZIPALIGN" -p -f 4 "$APK_RAW" app/build/outputs/apk/aligned.apk
          
          "$APKSIGNER" sign --ks app/blueplus.jks \
            --ks-key-alias blueplus \
            --ks-pass pass:blueplus123 \
            --key-pass pass:blueplus123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app/build/outputs/apk/BluePlus-v1.3.apk \
            app/build/outputs/apk/aligned.apk
            
          "$APKSIGNER" verify --verbose app/build/outputs/apk/BluePlus-v1.3.apk
          
          echo "apk_path=app/build/outputs/apk/BluePlus-v1.3.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BluePlus-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3-build-${{ github.run_number }}
          name: Blue+ v1.3 (Build ${{ github.run_number }})
          body: |
            ### Blue+ IPTV & Media Player APK
            - **Build Number:** ${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
            - **Branch:** ${{ github.ref_name }}

            يمكنك تحميل ملف الـ APK وتثبيته مباشرة على الهاتف أو شاشة التلفاز الذكية Android TV / TV Box.
          files: ${{ steps.find_apk.outputs.apk_path }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
